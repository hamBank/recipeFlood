# Apache vhost for Recipe Flood. TLS: run
# `certbot --apache -d recipeflood.hups.club` after the first deploy —
# certbot rewrites this vhost for :443 automatically.
<VirtualHost *:80>
    ServerName recipeflood.hups.club

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/

    ErrorLog ${APACHE_LOG_DIR}/recipeflood-error.log
    CustomLog ${APACHE_LOG_DIR}/recipeflood-access.log combined
</VirtualHost>
