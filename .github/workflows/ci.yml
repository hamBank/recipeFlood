name: CI

on:
  pull_request:
  push:
    branches: [main]

# Every job that imports backend.config (pytest, alembic, the snapshot
# load) runs with auth off: with auth on, the app refuses to start on the
# default JWT_SECRET (fleet spec CFG-2). Tests that need auth turn it on
# themselves, with a secret of their own.
env:
  AUTH_ENABLED: "false"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build

  snapshot:
    # The committed blog snapshot is what the collection is rebuilt from, so
    # a change that makes it unloadable should fail before it reaches main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.load_snapshot --heuristic

  migrations-postgres:
    # The `backend` job above only ever exercises migrations against
    # SQLite, but production runs Postgres — and the two dialects have
    # genuinely diverged here before (see the enum-widening migrations'
    # git history). A real Postgres instance, a full downgrade back to
    # base and an upgrade back to head is what actually catches that,
    # rather than a second SQLite run under a different name.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipeflood_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # +psycopg2, matching requirements.txt (psycopg2-binary) and
      # .env.example's production URL — not +psycopg (v3), which isn't
      # installed by requirements.txt at all and would only "work" here
      # by accident if a dev machine happened to have it lying around.
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/recipeflood_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: alembic check
      - name: Round-trip every migration's downgrade
        run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check

  backend-postgres:
    # The whole backend suite again, on Postgres (fleet spec DB-4). SQLite
    # passes things production won't: it doesn't enforce foreign keys by
    # default, so the first run here found that a recipe still on a
    # cooking list could not be deleted in production at all.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipeflood_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # tests/conftest.py builds each test's schema here instead of in
      # in-memory SQLite. +psycopg2, as in migrations-postgres.
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/recipeflood_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest

  fleet-spec:
    # Static checks against the hamBank fleet spec (github.com/hamBank/fleetSpec),
    # pinned to the version .fleet-spec.yml declares so a spec change never
    # breaks this CI unexpectedly. Recorded deviations live in that file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: spec
        run: echo "version=$(awk '/^spec:/ {print $2}' .fleet-spec.yml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: hamBank/fleetSpec
          ref: v${{ steps.spec.outputs.version }}
          path: .fleetspec
          # fleetSpec is private: a read-only fine-grained token for it
          # (Contents: read), stored as this repo's FLEETSPEC_TOKEN secret.
          token: ${{ secrets.FLEETSPEC_TOKEN || github.token }}
      - run: pip install pyyaml
      - run: python .fleetspec/conformance/check.py --app . --summary "$GITHUB_STEP_SUMMARY"
