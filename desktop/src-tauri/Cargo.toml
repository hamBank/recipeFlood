[package]
name = "recipe-flood"
version = "0.1.0"
description = "Recipe Flood desktop app"
edition = "2021"

[lib]
name = "recipe_flood_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
getrandom = "0.3"
subtle = "2"
url = "2"
